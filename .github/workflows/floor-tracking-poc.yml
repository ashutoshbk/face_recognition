name: Floor tracking PoC
on:
  pull_request:
    paths: ['floor_tracking_poc/**', '.github/workflows/floor-tracking-poc.yml']
  push:
    paths: ['floor_tracking_poc/**', '.github/workflows/floor-tracking-poc.yml']
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floor_tracking_poc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest==8.4.2
      - name: Check required vendored model architecture source
        run: python -c "from pathlib import Path; assert Path('engines/calibration/vendor/vggt/vggt/models/vggt.py').is_file(); assert Path('engines/calibration/vendor/vggt/vggt/models/aggregator.py').is_file()"
      - run: python -m pytest tests -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'

name: camex-mct-ci

on:
  push:
    paths:
      - "multicamera_tracking_poc/**"
      - ".github/workflows/camex-mct-ci.yml"
  pull_request:
    paths:
      - "multicamera_tracking_poc/**"
      - ".github/workflows/camex-mct-ci.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multicamera_tracking_poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            multicamera_tracking_poc/requirements.txt
            multicamera_tracking_poc/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: ruff check src tests examples scripts
      - run: python -m pytest -q tests

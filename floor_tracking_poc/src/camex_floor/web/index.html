<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CAMEX Floor Calibration</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>CAMEX <span>Floor Calibration</span></strong><span id="siteName"></span><button id="add">Add camera</button><button id="export">Export project</button></header>
<div class="shell"><aside><div class="section-label">CAMERAS</div><div id="cameras"></div><div class="section-label">FLOOR SCALE</div><label>Pixels / metre <input id="ppm" type="number" min="0.01" step="0.1"></label><button id="scaleSave">Save scale</button><label>Known distance (m)<input id="distance" type="number" value="1" min="0.01" step="0.1"></label><button id="measure">Measure on plan</button><div class="section-label">OVERLAY</div><select id="overlayMode"><option value="none">None</option><option value="points">Top-view points</option><option value="image">Image ground projection</option></select><label>Opacity <input id="opacity" type="range" min="0" max="1" value="0.35" step="0.05"></label><label>Rotate (deg)<input id="rotation" type="number" value="0" step="1"></label><label>Scale multiplier<input id="multiplier" type="number" value="1" min="0.1" max="10" step="0.02"></label><button id="transform">Apply transform</button><button id="move">Move overlay</button></aside>
<main><div class="canvas-title">GLOBAL FLOOR PLAN <span id="modeLabel"></span></div><canvas id="floor"></canvas></main>
<section class="inspector"><div class="canvas-title"><strong id="cameraName"></strong><span id="approval"></span></div><canvas id="reference"></canvas><div class="controls"><div class="segmented"><button id="fitRole" class="selected">Fit point</button><button id="checkRole">Holdout point</button></div><button id="undo">Remove last</button></div><div class="controls"><button id="fit">Fit floor projection</button><button id="fitLayer">Fit local layer</button><button id="save">Save draft</button><button id="approve">Approve calibration</button></div><div id="stats"></div><div id="points"></div></section></div>
<footer><span id="status">Loading project</span><span id="revision"></span></footer>
<dialog id="cameraDialog"><form id="cameraForm"><h2>Add camera</h2><label>Camera ID<input name="id" required pattern="[A-Za-z0-9_-]+"></label><label>Label<input name="label"></label><label>Rectified reference image<input name="image" type="file" accept="image/*" required></label><p id="uploadStatus"></p><div class="controls"><button type="button" id="cancelAdd">Cancel</button><button type="submit">Register camera</button></div></form></dialog>
<script type="module" src="app.js"></script></body></html>
